<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kilat Kitchen</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0714; }
  /* The 1280x720 field, scaled to the window and centred. */
  #game { position: fixed; inset: 0; margin: auto; width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); display: block; touch-action: none; cursor: pointer; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Kilat Kitchen: a night-market cooking game. Walk the chef with WASD or the arrow keys, use counters with E or Space, or click a counter to walk there and use it. Fetch, chop, cook and plate the dishes on the order board, then serve them at the window before the timers run out."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
